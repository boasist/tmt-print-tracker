configuration:
  profile:
    name: Build profile
    description: >-
      Which plates count toward a TMT and how many of each part one TMT needs. Use a built-in profile name
      (makegood_tmt_rev_c), or the file name of your own profile in this add-on's config folder (profiles/my_build.yaml).
  printers:
    name: Printers
    description: >-
      Leave empty to use every Bambu Lab printer in Home Assistant. Or list them: a display name and the entity prefix
      (for sensor.my_printer_print_status the prefix is my_printer).
  log_level:
    name: Log level
