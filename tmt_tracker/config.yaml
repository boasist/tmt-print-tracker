name: TMT Print Tracker
version: "0.3.6"
slug: tmt_tracker
description: >-
  Track the 3D-printed parts of Toddler Mobility Trainer (TMT) builds from your Bambu Lab printers: every part, which
  plate prints it, and how far along each TMT is.
url: https://github.com/boasist/tmt-print-tracker
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:printer-3d
panel_title: TMT
homeassistant_api: true
map:
  - type: addon_config
    read_only: false
options:
  profile: makegood_tmt_rev_c
  printers: []
  notify: []
  log_level: info
schema:
  profile: str
  printers:
    - name: str
      entity_prefix: str
  notify:
    - str
  alert_url: str?
  log_level: list(debug|info|warning|error)
