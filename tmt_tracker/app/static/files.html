<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TMT 3MF Files</title>
<!-- The 3MF files page: the files in this app's folder (files/), their plates and parts, and what counts toward a TMT.
     Reads api/files; changes go to api/files_action (catalog.py keeps them in build.json). Uploads go up in pieces
     (api/upload_part), since Home Assistant's ingress refuses requests over 16 MiB. -->
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1d2330;--muted:#6b7385;--line:#e3e6ec;--accent:#2f6fe4;--ok:#1f9d55;--warn:#d98b06;--bad:#d64545;--chip:#eef1f6}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1b2029;--ink:#e7eaf0;--muted:#97a0b2;--line:#2a313d;--accent:#5b8ff0;--ok:#3cc47a;--warn:#f0a73a;--bad:#ef6b6b;--chip:#242b36}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:16px;padding:16px 20px;flex-wrap:wrap}
header h1{font-size:22px;margin:0}
header a{color:var(--accent);text-decoration:none}
header .conn{margin-left:auto;font-size:13px;color:var(--muted)}
main{padding:0 20px 40px;max-width:1400px;margin:0 auto}
section{margin:18px 0}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px}
h3{font-size:14px;margin:12px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0;overflow-wrap:break-word}
.card.new{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn) inset}
.muted{color:var(--muted)}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:var(--chip);color:var(--muted);margin:0 4px 2px 0;white-space:nowrap}
.tag.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.tag.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.tag.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.tag.now{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
button,select,input{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:4px 10px}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.small{padding:0 8px;line-height:22px}
button.link{border:0;background:none;color:var(--accent);padding:0}
input[type=number]{width:72px}
input.name{width:100%;min-width:120px}
select{max-width:100%}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;font-size:13px}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--chip)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.nw{white-space:nowrap}
tr.off td{opacity:.55}
tr.grp td{background:var(--chip);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.scroll{overflow-x:auto;border-radius:12px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.thumb{width:56px;height:56px;object-fit:contain;background:var(--chip);border-radius:8px;display:block}
.thumb.big{width:72px;height:72px}
details.file{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
details.file>summary{list-style:none;cursor:pointer;padding:10px 14px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
details.file>summary::-webkit-details-marker{display:none}
details.file>summary .t{font-weight:600}
details.file>summary .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
details.file[open]>summary{border-bottom:1px solid var(--line)}
.fbody{padding:12px 14px;display:grid;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:4px 18px;font-size:13px}
.facts b{font-weight:600;color:var(--muted);margin-right:6px}
.objs{font-size:13px;line-height:1.5}
.swatch{display:inline-block;width:10px;height:10px;border-radius:3px;border:1px solid var(--line);vertical-align:-1px;margin-right:3px}
.form{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.form label{display:grid;gap:2px;font-size:13px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:0}
.prs label{margin-right:8px;white-space:nowrap;font-size:13px}
.drop{position:fixed;inset:0;background:color-mix(in srgb,var(--accent) 22%,transparent);border:3px dashed var(--accent);display:none;align-items:center;justify-content:center;font-size:22px;font-weight:600;color:var(--accent);z-index:8}
.drop.on{display:flex}
.toast{position:fixed;right:16px;bottom:16px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;opacity:0;transition:opacity .3s;max-width:460px;z-index:9;white-space:pre-line}
.toast.show{opacity:.95}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:16px;max-width:420px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(0,0,0,.35)}
@media (max-width:600px){header,main{padding-left:16px;padding-right:16px}.hide-sm{display:none}}
</style>
</head>
<body>
<header>
  <a href="./">← TMT Print Tracker</a>
  <h1>3MF files</h1>
  <span class="conn" id="conn">loading…</span>
</header>
<main>
  <section><div class="card" style="display:grid;gap:8px">
    <div class="bar">
      <button class="primary" onclick="$('pick').click()">Add 3MF files…</button>
      <input type="file" id="pick" accept=".3mf" multiple hidden onchange="upload([...this.files]);this.value=''">
      <button onclick="scan()">Refresh folder</button>
      <span id="busy" class="muted"></span>
    </div>
    <p class="hint" id="where"></p>
  </div></section>
  <section id="new-sec" hidden><h2>New files</h2><div id="new"></div></section>
  <section id="prof-sec" hidden><h2>Design files the build profile knows</h2><div class="card" id="prof"></div></section>
  <section><h2>One TMT</h2><div class="card" id="build"></div></section>
  <section><h2>Files</h2><div id="files"></div><div id="gone"></div></section>
  <section><h2>Parts per TMT</h2><p class="hint" style="margin-bottom:8px">Rename a part or change how many a TMT needs here.
    "Made from" is every plate that prints it; ★ is the plate the print queue uses.</p><div class="scroll"><table id="parts"></table></div></section>
</main>
<div class="drop" id="drop">Drop 3MF files to add them</div>
<div class="toast" id="toast"></div>
<dialog id="gdlg">
  <h3 style="margin-top:0">New group</h3>
  <div class="form" style="display:grid;gap:10px">
    <label>Name<input id="g-name" class="name" placeholder="e.g. Table"></label>
    <label>For a TMT this group is<select id="g-kind"><option value="req">required</option><option value="plan">optional, but queued and planned</option><option value="opt">optional, not planned</option></select></label>
    <div class="bar" style="justify-content:flex-end"><button onclick="$('gdlg').close()">Cancel</button><button class="primary" onclick="newGroupOk()">Add group</button></div>
  </div>
</dialog>
<script>
const MATERIALS=['PETG','TPU','PLA','ABS','ASA','PC','PA'];
const KINDS={req:'required',plan:'optional, planned',opt:'optional'};
let DATA=null, rep=null, cat=null, st=null, PRINTERS=[], drafts={}, editing=new Set(), opened=new Set(), gdraft=null, gEdited=false, gTarget=null;

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
function setHTML(id,html){const el=$(id);const a=document.activeElement;if(el._html===html||(a&&['SELECT','INPUT'].includes(a.tagName)&&el.contains(a)))return;el._html=html;el.innerHTML=html;}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),msg.length>80?8000:4000);}
const hrs=h=>h>=1?h.toFixed(1)+' h':Math.round(h*60)+' min';
const mb=n=>n>=1e6?(n/1e6).toFixed(1)+' MB':Math.round(n/1e3)+' kB';
const day=t=>t?new Date(t).toLocaleDateString([],{year:'numeric',month:'short',day:'numeric'}):'';
const clean=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const thumb=n=>n?'thumbs/'+encodeURIComponent(n):'';
const cfg=()=>cat.cfg;
const fileAt=i=>rep.files[i];
const kindOf=g=>!g?'req':g.optional?(g.plan?'plan':'opt'):'req';
const partById=id=>cat&&cat.parts.find(p=>p.id===id);
const fname=f=>f.label||f.title||f.file;
const prName=k=>(PRINTERS.find(p=>p.key===k)||{name:k}).name;
const liveCustoms=()=>((st&&st.custom_sources)||[]).filter(s=>Object.keys(s.yields).every(pid=>cat.parts.some(p=>p.id===pid)));

// ------------------------------------------------------------------ data
async function loadAll(){
  try{
    const r=await fetch('api/files',{cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status);
    DATA=await r.json(); cat=DATA.catalog; st=DATA.state; PRINTERS=DATA.printers||[];
    rep={files:cat.files||[],removed:cat.removed||[],missing:cat.gone||[]};
    $('conn').textContent=`add-on ${DATA.version}`;
  }catch(e){$('conn').textContent='not answering ('+e.message+')'; return;}
  render();
}
async function tmt(cmd,data={}){
  let out={ok:false,error:'no answer'};
  try{out=await (await fetch('api/files_action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cmd,...data})})).json();}catch(e){out.error=e.message;}
  if(!out.ok) toast('Failed: '+(out.error||'unknown'));
  else if((out.notes||[]).length||(out.errors||[]).length) toast([...(out.notes||[]),...(out.errors||[])].join('\n'));
  await loadAll();
  return out;
}
function busy(t){$('busy').textContent=t||'';}

// ------------------------------------------------------------------ adding files and refreshing
async function scan(){
  busy('Looking at the folder…');
  const r=await tmt('scan'); busy('');
  if(r.ok&&!(r.notes||[]).length) toast(r.new&&r.new.length?`${r.new.length} new file${r.new.length>1?'s':''}: say what ${r.new.length>1?'they are':'it is'} below`:'No new files');
  if(r.ok&&r.new&&r.new.length) $('new-sec').scrollIntoView({behavior:'smooth'});
}
const PIECE=8*1024*1024;   // Home Assistant's ingress refuses request bodies over 16 MiB, so files go up in pieces
async function uploadOne(f){
  const id=Math.random().toString(36).slice(2,10)+Date.now().toString(36);
  for(let off=0;;off+=PIECE){
    busy(`Uploading ${f.name}: ${Math.round(100*Math.min(off,f.size)/Math.max(f.size,1))}%`);
    const q=new URLSearchParams({upload:id,name:f.name,offset:off,size:f.size});
    const res=await fetch('api/upload_part?'+q,{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:f.slice(off,off+PIECE)});
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const r=await res.json(); if(!r.ok) throw new Error(r.error);
    if(r.saved) return r;
    if(r.received>=f.size) busy(`Reading ${f.name}… (a big file takes a few minutes the first time)`);
  }
}
async function upload(files){
  const list=files.filter(f=>/\.3mf$/i.test(f.name));
  if(list.length<files.length) toast('Only .3mf files can be added');
  let added=0; const notes=[];
  for(const f of list){
    if(rep&&rep.files.some(x=>x.file===f.name)&&!confirm(`${f.name} is already in the folder. Replace it? Its settings stay.`)) continue;
    try{const r=await uploadOne(f); added++; notes.push(...(r.notes||[]),...(r.errors||[]));}
    catch(e){toast(`${f.name}: ${e.message}`);}
  }
  busy('');
  if(notes.length) toast(notes.join('\n')); else if(added) toast(`Added ${added} file${added>1?'s':''}`);
  await loadAll();
  if(added&&rep.files.some(f=>!f.classified&&!f.error)) $('new-sec').scrollIntoView({behavior:'smooth'});
}
let dragN=0;
addEventListener('dragenter',e=>{if([...e.dataTransfer.types].includes('Files')){dragN++;$('drop').classList.add('on');}});
addEventListener('dragleave',()=>{if(--dragN<=0){dragN=0;$('drop').classList.remove('on');}});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();dragN=0;$('drop').classList.remove('on');if(e.dataTransfer.files.length) upload([...e.dataTransfer.files]);});

// ------------------------------------------------------------------ helpers from the state
function printed(sid){   // counted prints of a plate (from the recent log)
  const es=((st&&st.log)||[]).filter(e=>e.source===sid&&e.result==='counted');
  return {n:es.length,last:es.length?es[es.length-1].time:null};
}
function timesOf(sid){
  return PRINTERS.map(p=>{const t=(((st&&st.plate_times)||{})[p.key]||{})[sid]; return t?`${p.name} ${hrs(t.h)}`:'';}).filter(Boolean).join(' · ');
}
function producers(){   // the plate the print queue makes each part from: the most of it, then the most pieces
  const out={}, skip=new Set((st&&st.queue_skip)||[]);
  const srcs=[...cat.sources,...liveCustoms()].filter(s=>s.counts&&!skip.has(s.id));
  for(const s of srcs) for(const [pid,n] of Object.entries(s.yields)){
    const c=out[pid], tot=o=>Object.values(o.yields).reduce((a,b)=>a+b,0);
    if(!c||n>c.yields[pid]||(n===c.yields[pid]&&tot(s)>tot(c))) out[pid]=s;
  }
  return out;
}
const plateLabel=s=>s.custom?`${s.plate_name} (custom plate)`:`${s.plate_name||s.label||s.title} · plate ${s.plate}`;
function defaultQty(pid){let q=0; for(const s of cat.sources) if(s.counts&&s.yields[pid]) q=Math.max(q,s.yields[pid]); return q;}

// ------------------------------------------------------------------ render
function render(){
  if(!rep||!cat||!st) return;
  $('where').innerHTML=`${DATA.profile_error?`<b>Build profile problem:</b> ${esc(DATA.profile_error)}<br>`:''}Add files here (or drop them on this page), or copy them into this app's folder
    (<code>addon_configs/…_tmt_tracker/files</code>, shown as <code>app_configs</code> on newer Home Assistant) and press Refresh.
    ${rep.files.length} files, ${rep.files.reduce((a,f)=>a+(f.plates||[]).length,0)} plates · build profile: ${esc(DATA.profile||'none')}`;
  renderProfile();
  const fresh=rep.files.map((f,i)=>[f,i]).filter(([f])=>!f.classified||f.error);
  $('new-sec').hidden=!fresh.length;
  setHTML('new',fresh.map(([f,i])=>fileCard(f,i,true)).join(''));
  renderBuild();
  setHTML('files',rep.files.map((f,i)=>[f,i]).filter(([f])=>f.classified&&!f.error).map(([f,i])=>fileCard(f,i,false)).join('')||'<div class="card muted">No files set up yet.</div>');
  const gone=(rep.removed||[]).map(n=>`<div class="bar" style="margin:4px 0"><span>${esc(n)}</span><button class="small" onclick='restore(${esc(JSON.stringify(n))})'>Put back</button></div>`).join('');
  const missing=(rep.missing||[]).filter(n=>!(rep.removed||[]).includes(n));
  setHTML('gone',(gone?`<div class="card" style="margin-top:10px"><b>Removed</b> <span class="muted">(moved to files/removed, where you can delete them for good; their settings are kept)</span>${gone}</div>`:'')+
    (missing.length?`<div class="card" style="margin-top:10px"><b>Not in the folder</b> <span class="muted">(settings kept; add the file again to use them)</span><div>${missing.map(esc).join('<br>')}</div></div>`:''));
  renderParts();
}

function renderProfile(){
  const miss=cat.missing||[], skip=cat.skipped||[];
  $('prof-sec').hidden=!miss.length&&!skip.length;
  setHTML('prof',`${miss.length?`<p class="hint" style="margin-bottom:6px">Still needed for the build profile's TMT (matched by the Title inside the 3MF, so the file name doesn't matter).
      Download them from the designers and add them above, or say you don't use one.</p>
    ${miss.map(m=>`<div class="bar" style="margin:4px 0"><span><b>${esc(m.title)}</b></span><button class="small" onclick="skipProfile('${esc(m.key)}',true)">I don't use this one</button></div>`).join('')}`:''}
    ${skip.length?`<p class="hint" style="margin:${miss.length?'10px':'0'} 0 6px">Not used:</p>${skip.map(m=>`<div class="bar" style="margin:4px 0"><span class="muted">${esc(m.title)}</span><button class="small" onclick="skipProfile('${esc(m.key)}',false)">Use it again</button></div>`).join('')}`:''}`);
}
async function skipProfile(key,skip){await tmt('profile_skip',{key,skip});}

function fileCard(f,i,isNew){
  if(f.error) return `<div class="card new"><b>${esc(f.file)}</b><div class="tag bad">${esc(f.error)}</div>
    <div class="bar" style="margin-top:8px"><button class="small" onclick="removeFile(${i})">Remove it</button></div></div>`;
  const counted=f.plates.filter(p=>cat.sources.some(s=>s.id===p.id&&s.counts)).length;
  const pic=(f.plates.find(p=>p.thumb)||{}).thumb;
  const open=isNew||opened.has(f.file)||editing.has(f.file);
  const nozzle=f.nozzle?`${f.nozzle} mm nozzle`:'';
  const fil=(f.filaments||[]).map(x=>`<span class="tag"><span class="swatch" style="background:${esc(x.colour||'transparent')}"></span>${esc(x.type)}</span>`).join('');
  const from=f.from==='profile'?' <span class="tag ok">from the build profile</span>':f.from==='you'?' <span class="tag">set up by you</span>':'';
  const head=`<summary>${pic?`<img class="thumb" src="${esc(thumb(pic))}" alt="">`:'<span class="thumb"></span>'}
    <div><div class="t">${esc(fname(f))}${isNew?' <span class="tag warn">new</span>':from}</div>
      <div class="s">${esc(f.file)} · ${f.plates.length} plate${f.plates.length>1?'s':''}${isNew?'':`, ${counted} count toward a TMT`} · set up for ${esc(f.printer||'?')}${f.layer_mm?`, ${esc(f.layer_mm)} mm layers`:''}</div></div>
    <div>${fil}</div></summary>`;
  const body=editing.has(f.file)||isNew?editor(f,i,isNew):view(f,i);
  return `<details class="file${isNew?' new':''}" ${open?'open':''} ontoggle="tog(${i},this.open)">${head}<div class="fbody">${body}</div></details>`;
}
function tog(i,on){const f=fileAt(i); if(!f) return; if(on) opened.add(f.file); else opened.delete(f.file);}

function facts(f){
  const row=(k,v)=>v||v===0?`<div><b>${k}</b>${v}</div>`:'';
  return `<div class="facts">${row('Title',esc(f.title))}${row('Designer',esc(f.designer))}${row('Printer it was set up for',esc(f.printer))}
    ${row('Nozzle',f.nozzle?esc(f.nozzle)+' mm':'')}${row('Layers',f.layer_mm?esc(f.layer_mm)+' mm':'')}${row('Infill / walls',esc([f.infill,f.walls&&f.walls+' walls'].filter(Boolean).join(' · ')))}
    ${row('Plate type',esc(f.bed))}${row('Filament profiles',esc((f.filaments||[]).map(x=>x.profile).filter(Boolean).join(', ')))}
    ${row('Sliced',f.sliced?'yes (has G-code)':'no (slice it in Bambu Studio)')}${row('File',esc(mb(f.size)+' · changed '+day(f.modified)))}
    ${row('Made with',esc(f.app))}</div>${f.description?`<p class="hint">${esc(f.description)}</p>`:''}`;
}

function view(f,i){
  const groups=Object.fromEntries(cfg().groups.map(g=>[g.name,g]));
  const rows=f.plates.map(p=>{
    const s=cat.sources.find(x=>x.id===p.id)||{}, g=groups[s.group], pr=printed(p.id);
    const objs=Object.entries(s.yields||{}).map(([pid,n])=>`${n} × ${esc((partById(pid)||{}).name||pid)}`).join('<br>');
    const set=s.set?`<br><span class="tag now">plates ${s.set.plates.map(x=>x.split('#')[1]).join(' + ')} together</span>`:'';
    const only=[...(s.printers||[]).map(prName),...(s.printer_models||[]).map(m=>m+' models')];
    return `<tr class="${s.counts?'':'off'}"><td>${p.thumb?`<img class="thumb" src="${esc(thumb(p.thumb))}" alt="" loading="lazy">`:''}</td>
      <td><b>${p.plate}</b> ${esc(s.plate_name||'')}</td>
      <td class="objs">${s.counts?objs+set:`<span class="muted">${p.objects.map(o=>`${o.n} × ${esc(o.raw)}`).join('<br>')}</span>`}</td>
      <td>${s.counts?`${esc(s.group)}${g&&g.optional?` <span class="tag">${KINDS[kindOf(g)]}</span>`:''}`:'<span class="muted">doesn\'t count</span>'}</td>
      <td>${s.counts?esc((partById(Object.keys(s.yields)[0])||{}).material||''):esc(p.filaments.join(', '))}${only.length?`<br><span class="tag">${esc(only.join(', '))} only</span>`:''}</td>
      <td class="num nw">${p.volume_cm3?esc(p.volume_cm3)+' cm³':''}</td>
      <td>${timesOf(p.id).split(' · ').map(esc).join('<br>')}</td>
      <td class="num nw">${pr.n?`${pr.n}<br><span class="muted">${esc(day(pr.last))}</span>`:''}</td></tr>`;
  }).join('');
  return `${facts(f)}
    <div class="scroll"><table><tr><th></th><th>Plate</th><th>Makes</th><th>Group</th><th>Filament</th><th class="num">Volume</th><th>Print time</th><th class="num">Printed</th></tr>${rows}</table></div>
    <div class="bar"><button onclick="startEdit(${i})">Edit plates and parts</button><button onclick="removeFile(${i})">Remove file…</button></div>`;
}

// ------------------------------------------------------------------ editing a file (and classifying a new one)
function draftFor(f){
  const fc=cfg().files[f.file]||{}, d={label:fc.label||'',plates:{},objects:{},sets:[]};
  for(const p of f.plates){
    const pc=(fc.plates||{})[p.plate]||{};
    d.plates[p.plate]={group:pc.group||'',material:pc.material||p.filaments[0]||'PETG',printers:pc.printers||[],printer_models:pc.printer_models||[],name:pc.name||''};
    for(const o of p.objects) if(!d.objects[o.raw]) d.objects[o.raw]={pid:o.part,name:o.name,orig:o.part,how:o.how,auto:o.name};
  }
  for(const s of fc.sets||[]){const [pid,n]=Object.entries(s.yields)[0]||['',1]; d.sets.push({plates:[...s.plates],pid,n,name:(partById(pid)||{}).name||''});}
  return d;
}
function startEdit(i){const f=fileAt(i); drafts[f.file]=draftFor(f); editing.add(f.file); opened.add(f.file); render();}
function cancelEdit(i){const f=fileAt(i); delete drafts[f.file]; editing.delete(f.file); render();}
const D=i=>{const f=fileAt(i); return drafts[f.file]||(drafts[f.file]=draftFor(f));};
function rerender(){for(const id of ['new','files']) $(id)._html=null; render();}

function groupSelect(i,n,cur){
  return `<select onchange="setGroup(${i},${n},this)"><option value=""${cur?'':' selected'}>doesn't count</option>
    ${cfg().groups.map(g=>`<option${g.name===cur?' selected':''} value="${esc(g.name)}">${esc(g.name)}${g.optional?` (${KINDS[kindOf(g)]})`:''}</option>`).join('')}
    <option value="__new__">+ new group…</option></select>`;
}
function partSelect(attr,cur,isNew){
  const gs=cfg().groups.map(g=>g.name);
  return `<select ${attr}>${isNew?`<option value="${esc(cur)}" selected>a new part</option>`:''}
    ${gs.map(g=>{const ps=cat.parts.filter(p=>p.group===g); return ps.length?`<optgroup label="${esc(g)}">${ps.map(p=>`<option value="${esc(p.id)}"${p.id===cur?' selected':''}>${esc(p.name)}</option>`).join('')}</optgroup>`:'';}).join('')}
    ${isNew?'':'<option value="__new__">a new part…</option>'}</select>`;
}
function editor(f,i,isNew){
  const d=D(i), counting=f.plates.filter(p=>d.plates[p.plate].group);
  const mats=[...new Set([...MATERIALS,...f.plates.flatMap(p=>p.filaments)])];
  const plates=f.plates.map(p=>{const pd=d.plates[p.plate]; return `<tr class="${pd.group?'':'off'}">
    <td>${p.thumb?`<img class="thumb big" src="${esc(thumb(p.thumb))}" alt="" loading="lazy">`:''}</td>
    <td><b>${p.plate}</b><br><input class="name" placeholder="${esc(p.name3mf||f.title||'name')}" value="${esc(pd.name)}" oninput="D(${i}).plates[${p.plate}].name=this.value" onchange="rerender()"></td>
    <td>${groupSelect(i,p.plate,pd.group)}</td>
    <td>${pd.group?`<select onchange="D(${i}).plates[${p.plate}].material=this.value">${mats.map(m=>`<option${m===pd.material?' selected':''}>${esc(m)}</option>`).join('')}</select>`:esc(p.filaments.join(', '))}</td>
    <td class="prs">${pd.group?PRINTERS.map(pr=>`<label><input type="checkbox"${pd.printers.includes(pr.key)?' checked':''} onchange="togPrinter(${i},${p.plate},'${pr.key}',this.checked)"> ${esc(pr.name)}</label>`).join('')
      +(pd.printer_models.length?`<br><span class="tag">${esc(pd.printer_models.join(', '))} models only</span><button class="small link" onclick="D(${i}).plates[${p.plate}].printer_models=[];rerender()">any model</button>`:'')
      +'<br><span class="muted" style="font-size:12px">none ticked = any</span>':''}</td>
    <td class="objs">${p.objects.map(o=>`${o.n} × ${esc(o.raw)}`).join('<br>')}</td></tr>`;}).join('');
  const raws=relevantRaws(f,d);
  const objRows=raws.map((r,k)=>{const o=d.objects[r], isNew=!partById(o.pid);
    const on=counting.filter(p=>p.objects.some(x=>x.raw===r)).map(p=>p.plate);
    return `<tr><td class="objs">${esc(r)}<br><span class="muted">plate${on.length>1?'s':''} ${on.join(', ')}</span></td>
      <td>${partSelect(`onchange="setPart(${i},${esc(JSON.stringify(r))},this)"`,o.pid,isNew)}</td>
      <td>${isNew?`<input class="name" value="${esc(partName(f,d,r))}" oninput="Object.assign(D(${i}).objects[${esc(JSON.stringify(r))}],{name:this.value,edited:true})">`:`<span class="muted">${esc(partById(o.pid).group)}</span>`}</td></tr>`;}).join('');
  const sets=d.sets.map((s,k)=>{const isNew=!partById(s.pid); return `<div class="bar" style="margin:4px 0">plates
    ${f.plates.map(p=>`<label style="font-size:13px"><input type="checkbox"${s.plates.includes(p.plate)?' checked':''} onchange="togSet(${i},${k},${p.plate},this.checked)"> ${p.plate}</label>`).join(' ')}
    make <input type="number" min="1" value="${s.n}" oninput="D(${i}).sets[${k}].n=+this.value||1"> ×
    ${partSelect(`onchange="setSetPart(${i},${k},this)"`,s.pid,isNew)}
    ${isNew?`<input class="name" style="width:auto" placeholder="item name" value="${esc(s.name)}" oninput="D(${i}).sets[${k}].name=this.value">`:''}
    <button class="small" onclick="D(${i}).sets.splice(${k},1);rerender()">✕</button></div>`;}).join('');
  return `${facts(f)}
    ${isNew?`<p class="hint"><b>New file.</b> Pick a group for each plate that counts toward a TMT, and leave the others on "doesn't count" (test
      plates, other versions). Name the plates and parts the way you want them shown. Plates that don't count are still recognised when printed.</p>`:''}
    ${f.from==='profile'?`<p class="hint">This file is set up by the build profile. Saving makes these settings your own: it then no longer follows
      changes to the profile in app updates.</p>`:''}
    <div class="form"><label>Name on this page<input class="name" style="width:320px" placeholder="${esc(f.title||f.file)}" value="${esc(d.label)}" oninput="D(${i}).label=this.value"></label></div>
    <div class="scroll"><table><tr><th></th><th>Plate · its name on the printer cards and queue</th><th>Counts toward a TMT as</th><th>Filament</th><th>Only on</th><th>Objects in the file</th></tr>${plates}</table></div>
    ${raws.length?`<h3>Parts</h3><p class="hint">Each object on a counting plate is a part. Pick an existing part when it's another version of one
      (it then counts toward the same part), or keep it as a new part and name it.</p>
      <div class="scroll"><table><tr><th>Object</th><th>Counts as</th><th>Part name (the parts lists) / group</th></tr>${objRows}</table></div>`:''}
    ${f.plates.length>1?`<h3>Printed together</h3><p class="hint">Plates that only make an item once all of them have printed (the tablet holder's
      two plates make one tablet holder). Their objects don't count on their own.</p>${sets}<div><button class="small" onclick="addSet(${i})">+ plates that go together</button></div>`:''}
    <div class="bar"><button class="primary" onclick="saveFile(${i})">${isNew?'Save':'Save changes'}</button>
      ${isNew?`<button onclick="saveFile(${i},true)">Doesn't count toward a TMT</button>`:`<button onclick="cancelEdit(${i})">Cancel</button>`}
      ${isNew?`<button onclick="removeFile(${i})">Remove file…</button>`:''}</div>`;
}
function partName(f,d,raw){   // a new part's name: what you typed, else the name of the plate it's alone on, else the 3MF's
  const o=d.objects[raw]; if(o.edited) return o.name;
  const on=f.plates.filter(p=>d.plates[p.plate].group&&p.objects.some(x=>x.raw===raw));
  const solo=on.length===1&&on[0].objects.length===1?(d.plates[on[0].plate].name||'').trim():'';
  return solo||o.name;
}
function relevantRaws(f,d){   // objects on counting plates (not ones printed together): each is a part
  const inSet=new Set(d.sets.flatMap(s=>s.plates));
  return [...new Set(f.plates.filter(p=>d.plates[p.plate].group&&!inSet.has(p.plate)).flatMap(p=>p.objects.map(o=>o.raw)))];
}
function setGroup(i,n,sel){
  if(sel.value==='__new__'){gTarget={i,n}; $('g-name').value=''; $('g-kind').value='req'; $('gdlg').showModal(); sel.value=D(i).plates[n].group; return;}
  D(i).plates[n].group=sel.value; rerender();
}
function togPrinter(i,n,key,on){const p=D(i).plates[n]; p.printers=on?[...new Set([...p.printers,key])]:p.printers.filter(k=>k!==key);}
function setPart(i,raw,sel){
  const o=D(i).objects[raw];
  if(sel.value==='__new__'){const name=prompt('Name of the new part:',o.auto); if(!name){sel.value=o.pid;return;} o.pid='new:'+clean(name); o.name=name; o.edited=true;}
  else{o.pid=sel.value; if(!partById(o.pid)){o.name=o.auto; o.edited=false;}}
  rerender();
}
function addSet(i){D(i).sets.push({plates:[],pid:'new:item',n:1,name:''}); rerender();}
function togSet(i,k,n,on){const s=D(i).sets[k]; s.plates=on?[...new Set([...s.plates,n])].sort((a,b)=>a-b):s.plates.filter(x=>x!==n); rerender();}
function setSetPart(i,k,sel){const s=D(i).sets[k]; if(sel.value==='__new__'){s.pid='new:item'; s.name='';} else s.pid=sel.value; rerender();}
async function newGroupOk(){
  const name=$('g-name').value.trim(), kind=$('g-kind').value;
  if(!name) return;
  if(cfg().groups.some(g=>g.name.toLowerCase()===name.toLowerCase())){toast('There is already a group called '+name);return;}
  $('gdlg').close();
  const groups=[...cfg().groups.map(g=>({...g})),{name,optional:kind!=='req',plan:kind==='plan'}];
  const t=gTarget; const r=await tmt('groups_save',{groups});
  if(r.ok&&t){D(t.i).plates[t.n].group=name; rerender();}
}
async function saveFile(i,none){
  const f=fileAt(i), d=D(i), plates={}, objects={}, parts={};
  for(const p of f.plates){const pd=d.plates[p.plate]; plates[p.plate]=none?{name:pd.name}:{...pd,group:pd.group||null};}
  const newId=(pid,name)=>pid.startsWith('new:')||!partById(pid)?(clean(name)||pid.replace(/^new:/,'')):pid;
  const rel=new Set(relevantRaws(f,d));
  for(const [raw,o] of Object.entries(d.objects)){
    if(!rel.has(raw)){if(o.how==='file') objects[raw]=o.orig; continue;}   // not a part here: keep what it was
    const isNew=!partById(o.pid), name=partName(f,d,raw), renamed=!!name&&name!==o.auto;
    const id=isNew&&(renamed||o.pid.startsWith('new:'))?newId(o.pid,name):o.pid;
    if(id!==o.orig||o.how==='file') objects[raw]=id;
    if(isNew&&renamed) parts[id]={name};
  }
  const sets=[];
  for(const s of d.sets){
    if(s.plates.length<2) continue;
    const isNew=!partById(s.pid);
    if(isNew&&!s.name.trim()){toast('Name the item those plates make together');return;}
    const id=isNew?clean(s.name):s.pid;
    sets.push({plates:s.plates,yields:{[id]:s.n||1}}); if(isNew) parts[id]={name:s.name.trim()};
  }
  if(!none&&!Object.values(plates).some(p=>p.group)&&!confirm('No plate counts toward a TMT. Save it like that (the file is then just tracked)?')) return;
  const r=await tmt('file_save',{file:f.file,label:d.label.trim(),plates,objects,sets,parts});
  if(r.ok){delete drafts[f.file]; editing.delete(f.file); opened.add(f.file); if(!(r.notes||[]).length) toast('Saved'); render();}
}
async function removeFile(i){
  const f=fileAt(i);
  const uses=cat.sources.filter(s=>s.file===f.file&&s.counts).length;
  if(!confirm(`Remove ${f.file} from the folder?${uses?`\n\nIts ${uses} counting plate${uses>1?'s':''} leave the build; the parts already printed stay in the counts.`:''}\n\nThe file moves to files/removed (nothing is deleted) and its settings are kept.`)) return;
  delete drafts[f.file]; editing.delete(f.file);
  await tmt('file_remove',{file:f.file});
}
async function restore(name){await tmt('file_restore',{file:name});}

// ------------------------------------------------------------------ one TMT: groups
function renderBuild(){
  if(!gdraft||!gEdited) gdraft=cfg().groups.map(g=>({...g,was:g.name}));   // follows saved changes until you edit here
  const req=cat.parts.filter(p=>!p.optional&&!p.alt), plan=cat.parts.filter(p=>p.optional&&p.plan), opt=cat.parts.filter(p=>p.optional&&!p.plan);
  const pcs=ps=>ps.reduce((a,p)=>a+p.qty,0);
  const used=new Set(Object.values(cfg().files).flatMap(fc=>Object.values(fc.plates||{}).map(p=>p.group)).filter(Boolean));
  const rows=gdraft.map((g,k)=>{const ps=cat.parts.filter(p=>p.group===g.was); return `<tr>
    <td><input class="name" value="${esc(g.name)}" oninput="gdraft[${k}].name=this.value;gDirty()"></td>
    <td><select onchange="gKind(${k},this.value)">${Object.entries(KINDS).map(([v,t])=>`<option value="${v}"${kindOf(g)===v?' selected':''}>${t}</option>`).join('')}</select></td>
    <td class="num">${ps.length}</td><td class="num">${pcs(ps)}</td>
    <td style="white-space:nowrap"><button class="small" ${k?'':'disabled'} onclick="gMove(${k},-1)">↑</button> <button class="small" ${k<gdraft.length-1?'':'disabled'} onclick="gMove(${k},1)">↓</button>
      ${used.has(g.was)?'':` <button class="small" onclick="gdraft.splice(${k},1);gDirty(true)">✕</button>`}</td></tr>`;}).join('');
  const changed=JSON.stringify(gdraft.map(({was,...g})=>g))!==JSON.stringify(cfg().groups.map(g=>({name:g.name,optional:!!g.optional,plan:!!g.plan})));
  setHTML('build',`<div class="bar" style="gap:18px;margin-bottom:10px"><span><b style="font-size:20px">${pcs(req)}</b> pieces, ${req.length} parts</span>
      ${plan.length?`<span class="muted">+ optional, planned: ${pcs(plan)} (${esc(plan.map(p=>p.name).join(', '))})</span>`:''}
      ${opt.length?`<span class="muted">+ optional: ${pcs(opt)}</span>`:''}</div>
    <div class="scroll"><table><tr><th>Group</th><th>For a TMT it is</th><th class="num">Parts</th><th class="num">Pieces</th><th></th></tr>${rows}</table></div>
    <div class="bar" style="margin-top:8px"><button class="primary" id="gsave" ${changed?'':'disabled'} onclick="saveGroups()">Save groups</button>
      <button ${changed?'':'disabled'} onclick="gEdited=false;$('build')._html=null;render()">Undo</button>
      <button onclick="gdraft.push({name:'New group',optional:false,plan:false,was:''});gDirty(true)">+ group</button>
      <span class="muted" style="font-size:13px">The order here is the parts table's order. Optional parts don't count toward a complete TMT; planned ones are still queued.</span></div>`);
}
function gDirty(re){gEdited=true; if(re){$('build')._html=null;renderBuild();} else{const b=$('gsave'); if(b) b.disabled=false;}}
function gKind(k,v){gdraft[k].optional=v!=='req'; gdraft[k].plan=v==='plan'; gDirty(true);}
function gMove(k,dir){const g=gdraft.splice(k,1)[0]; gdraft.splice(k+dir,0,g); gDirty(true);}
async function saveGroups(){
  const r=await tmt('groups_save',{groups:gdraft.map(g=>({name:g.name.trim(),optional:g.optional,plan:g.plan,was:g.was}))});
  if(r.ok){gEdited=false; if(!(r.notes||[]).length) toast('Saved'); $('build')._html=null; render();}
}

// ------------------------------------------------------------------ parts
function renderParts(){
  const prod=producers(), all=[...cat.sources,...liveCustoms()];
  let rows='';
  for(const g of cfg().groups){
    const ps=cat.parts.filter(p=>p.group===g.name);
    if(!ps.length) continue;
    rows+=`<tr class="grp"><td colspan="7">${esc(g.name)}${g.optional?` · ${KINDS[kindOf(g)]}`:''}</td></tr>`;
    for(const p of ps){
      const from=all.filter(s=>s.counts&&s.yields[p.id]).map(s=>`${prod[p.id]===s?'★ ':''}${esc(plateLabel(s))}${s.yields[p.id]>1?` (${s.yields[p.id]})`:''}`).join('<br>');
      const over=(cfg().parts[p.id]||{}).qty, def=defaultQty(p.id);
      rows+=`<tr><td><input class="name" value="${esc(p.name)}" onchange="renamePart('${esc(p.id)}',this)"></td>
        <td>${esc(p.code)}</td>
        <td class="num"><input type="number" min="1" value="${p.qty}" title="${over?`set by hand (the plates make ${def}); clear it to go back`:'what one counted plate makes'}" onchange="setQty('${esc(p.id)}',this)">${over?' <span class="tag now">set</span>':''}</td>
        <td>${esc(p.material)}</td><td class="objs">${from}</td>
        <td class="num">${(st.counts||{})[p.id]||0}</td>
        <td class="num">${Math.max(0,p.qty*(st.target||1)-((st.counts||{})[p.id]||0))}</td></tr>`;
    }
  }
  setHTML('parts',`<tr><th>Part</th><th>Code</th><th class="num">Per TMT</th><th>Filament</th><th>Made from</th><th class="num">Printed</th><th class="num">Still needed for ${st.target||1}</th></tr>${rows}`);
}
async function renamePart(id,inp){const name=inp.value.trim(); if(!name){inp.value=partById(id).name;return;} if(name!==partById(id).name) await tmt('part_save',{id,name});}
async function setQty(id,inp){const v=inp.value.trim(); await tmt('part_save',{id,qty:v===''?null:parseInt(v,10)});}

loadAll(); setInterval(()=>{if(!document.querySelector('details.file input:focus, details.file select:focus')&&!editing.size) loadAll();},60000);
</script>
